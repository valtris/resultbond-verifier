name: ResultBond Verifier CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Public verifier / Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install verifier and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp]" ruff mypy build twine pip-audit
      - name: Static checks
        run: |
          ruff check src tests scripts
          mypy --strict --follow-imports=skip src
      - name: Supply-chain audit of installed packages
        run: python -m pip_audit --path "$(python -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"
      - name: Real offline cryptographic tests and local MCP transport
        run: python -m unittest discover -s tests -v
      - name: Build and verify distribution
        run: |
          python -m build --wheel --outdir dist
          python -m twine check dist/*.whl
          python scripts/audit_wheel.py dist/*.whl
      - name: Reject reliance on the private ResultBond Core
        run: |
          python -m venv /tmp/standalone-verifier
          /tmp/standalone-verifier/bin/python -m pip install dist/*.whl "mcp>=2.3,<3"
          cd /tmp
          /tmp/standalone-verifier/bin/python -c 'import importlib.util, resultbond_verifier; assert importlib.util.find_spec("resultbond") is None; assert importlib.util.find_spec("resultbond_runner") is None; print("standalone verifier OK")'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.python == '3.12'
        with:
          name: resultbond-verifier-wheel
          path: dist/*.whl
          retention-days: 7
