name: ResultBond Verifier PyPI release

# Explicit manual release only; no push/tag/release event can upload.
on:
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: "Exactly the approved version from pyproject.toml"
        required: true
        default: "0.1.0"
      publish:
        type: boolean
        description: "UPLOAD to public PyPI? Leave false for dry run."
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: resultbond-verifier-pypi
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check release version and signed-off tag
        env:
          VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          grep -Fx "version = \"$VERSION\"" pyproject.toml
          if [[ "$PUBLISH" == "true" ]]; then
            git tag --points-at "$GITHUB_SHA" | grep -Fx "v$VERSION"
            test -f LICENSE
            test -f NOTICE
          fi
      - name: Test, build and audit EXACT public wheel
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[mcp]" build twine ruff mypy
          ruff check src tests scripts
          mypy --strict --follow-imports=skip src
          python -m unittest discover -s tests -v
          python -m build --wheel --outdir dist
          python -m twine check dist/*.whl
          python scripts/audit_wheel.py --version "$VERSION" dist/*.whl
      - uses: actions/upload-artifact@v4
        with:
          name: resultbond-verifier-release-wheel
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 7

  publish:
    if: inputs.publish == true
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/resultbond-verifier/
    permissions:
      id-token: write
    steps:
      - name: Require separate owner-enabled environment secret
        env:
          APPROVAL: ${{ secrets.RESULTBOND_VERIFIER_PYPI_RELEASE }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$APPROVAL" != "RESULTBOND_VERIFIER_RELEASE_APPROVED" ]]; then
            echo "PyPI publication remains disabled; missing independent owner approval." >&2
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: resultbond-verifier-release-wheel
          path: dist
      - name: Publish ONLY the vetted public verifier using PyPI OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
